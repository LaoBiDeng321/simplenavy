<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彼岸游戏工作室 - Other Shore Game Studio</title>
    <link rel="icon" type="image/png" href="../image/favicon.png">

    <!-- 样式表：设计令牌 → 加载层 → 组件 → 分区 → 响应式 -->
    <link rel="stylesheet" href="../css/design-system.css">
    <link rel="stylesheet" href="css/oss-loader.css">
    <link rel="stylesheet" href="css/oss-components.css">
    <link rel="stylesheet" href="css/oss-sections.css">
    <link rel="stylesheet" href="css/oss-responsive.css">
</head>
<body>
    <!-- 启动加载层：底部通栏进度条 0→100 → 遮罩自底向上滑场 → 停顿 → 主体渐显 -->
    <div id="loader" class="oss-loader" role="status" aria-live="polite">
        <div class="oss-loader-panel">
            <div class="oss-loader-ui">
                <div class="oss-loader-row">
                    <span class="oss-loader-brand">OTHERSHORE<span class="brand-dash">//</span>GAMESTUDIO</span>
                    <span class="oss-loader-rec">REC</span>
                </div>
                <div class="oss-loader-mid">
                    <!-- 中部品牌大字标（Game 部分强调色，与顶栏 logo 呼应） -->
                    <div class="oss-loader-name" aria-hidden="true">OtherShore<span class="name-accent">Game</span>Studio</div>
                </div>
                <div class="oss-loader-foot">
                    <div class="oss-loader-count"><span id="ossLoaderCount">000</span><span class="oss-loader-pct">%</span></div>
                    <div class="oss-loader-status-row">
                        <span class="oss-loader-status"><span data-i18n="oss.loader.status"></span><span class="status-cursor"></span></span>
                        <span class="oss-loader-ver">VER 26.09.06</span>
                    </div>
                    <!-- 底部通栏横向进度条 -->
                    <div class="oss-loader-track">
                        <div class="oss-loader-track-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 固定顶栏：品牌 + 语言切换 -->
    <header class="header">
        <a href="../index.html" class="logo" data-i18n-aria="oss.nav.home" aria-label="返回首页">
            <span class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2l10 10-10 10L2 12z"/>
                </svg>
            </span>
            <span>OtherShore<span class="logo-accent">Game</span>Studio</span>
        </a>
        <div class="topbar-lang" role="group" aria-label="语言切换">
            <button type="button" class="lang-btn" data-lang="zh-CN">CN</button>
            <button type="button" class="lang-btn" data-lang="en-US">EN</button>
        </div>
    </header>

    <!-- 右侧导航指示器 -->
    <nav class="fp-nav" aria-label="页面导航">
        <ul class="fp-nav-list">
            <li><span class="fp-nav-link active" data-section="0" aria-label="首页"></span></li>
            <li><span class="fp-nav-link" data-section="1" aria-label="工作室简介"></span></li>
            <li><span class="fp-nav-link" data-section="2" aria-label="核心团队"></span></li>
            <li><span class="fp-nav-link" data-section="3" aria-label="游戏作品"></span></li>
            <li><span class="fp-nav-link" data-section="4" aria-label="新闻动态"></span></li>
            <li><span class="fp-nav-link" data-section="5" aria-label="联系我们"></span></li>
        </ul>

    <!-- 全屏滚动容器 -->
    <div class="fullpage-container" id="fullpage">

        <!-- Section 1: Hero -->
        <section class="fp-section" data-anchor="home">
            <div class="fp-bg">
                <div class="hero-bg"></div>
            </div>
            <div class="corner-ticks" aria-hidden="true"></div>
            <div class="fp-content">
                <div class="hero-content">
                    <span class="hero-kicker animate-on-scroll" data-i18n="oss.hero.kicker"></span>
                    <h1 class="hero-title animate-on-scroll">OtherShore<span class="accent">Game</span>Studio</h1>
                    <p class="hero-subtitle animate-on-scroll" data-i18n="oss.hero.subtitle"></p>
                    <div class="hero-cta animate-on-scroll">
                        <button type="button" class="btn btn-primary" onclick="goToSection(3)" data-i18n="oss.hero.cta.works"></button>
                        <button type="button" class="btn btn-secondary" onclick="goToSection(1)" data-i18n="oss.hero.cta.about"></button>
                    </div>
                </div>
            </div>
            <div class="hero-readout" aria-hidden="true" data-i18n="oss.hero.readout"></div>
            <!-- 滚动提示：细线 + 光点下坠 -->
            <div class="scroll-hint" aria-hidden="true">
                <span class="scroll-text" data-i18n="oss.hero.scroll"></span>
                <div class="scroll-arrow"></div>
            </div>
        </section>

                        </div>
                    </div>

                    <div class="about-content">

                            <p data-i18n="oss.about.p2"></p>
                            <div class="about-stats">
                                <div class="stat-item">
                                    <span class="stat-number">1</span>
                                    <span class="stat-label" data-i18n="oss.about.stat1"></span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-number">2</span>
                                    <span class="stat-label" data-i18n="oss.about.stat2"></span>

                                <div class="stat-item">

                                    <span class="stat-label" data-i18n="oss.about.stat3"></span>
                                </div>
                            </div>
                        </div>
                        <div class="about-image animate-on-scroll">
                            <div class="image-placeholder">
                                <span data-i18n="oss.about.logo.placeholder"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
